services:
  messengerweb:
    image: ghcr.io/beluga73/messenger-api:${TAG}
    restart: always
    env_file: .env
    ports:
      - "${HOST_PORT}:8080"
    depends_on:
      postgresdb:
        condition: service_healthy
    networks:
      - messenger-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080

  postgresdb:
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: danilaubelou
      POSTGRES_DB: MessengerDb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d MessengerDb"]
      interval: 10s
    networks:
      - messenger-network

networks:
  messenger-network:
    driver: bridge
