services:
  messengerweb:
    image: ghcr.io/${REPOSITORY_OWNER}/messenger-api:${TAG}
    restart: always
    env_file: .env
    ports:
      - "${HOST_PORT}:8080"
    depends_on:
      postgresdb:
        condition: service_healthy
    networks:
      - messenger-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000

  postgresdb:
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: MessengerDb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d MessengerDb"]
      interval: 10s
    networks:
      - messenger-network

networks:
  messenger-network:
    driver: bridge
