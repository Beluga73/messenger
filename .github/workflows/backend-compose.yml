name: Backend Docker Compose

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-compose.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-compose.yml"

jobs:
  docker-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          cd backend/MessengerAPI
          docker build -f MessengerWeb/Dockerfile -t messenger-api:test .

      - name: Create .env file for testing
        run: |
          cd backend/MessengerAPI
          echo "REPOSITORY_OWNER=test" > .env
          echo "TAG=test" >> .env
          echo "HOST_PORT=8080" >> .env

      - name: Start Docker Compose
        run: |
          cd backend/MessengerAPI
          # Temporarily modify compose.yaml to use local image
          sed -i 's|image: ghcr.io/${REPOSITORY_OWNER}/messenger-api:${TAG}|image: messenger-api:test|' compose.yaml
          docker compose up -d

      - name: Wait for services to be healthy
        run: |
          timeout 30 bash -c 'until docker compose -f backend/MessengerAPI/compose.yaml exec -T postgresdb pg_isready -U admin -d MessengerDb; do sleep 1; done'

      - name: Check API health
        run: |
          sleep 5
          curl -f http://localhost:8080/health || echo "Health check endpoint may not exist"
        continue-on-error: true

      - name: View logs
        if: failure()
        run: docker compose -f backend/MessengerAPI/compose.yaml logs

      - name: Cleanup
        if: always()
        run: docker compose -f backend/MessengerAPI/compose.yaml down
